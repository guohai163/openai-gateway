# LB (PROXY protocol) -> Nginx (HTTPS) -> gateway (HTTP).
# Replace 192.0.2.10/32 with the actual LB source CIDR. Never trust all addresses.
# Configure gateway TRUSTED_PROXIES separately with Nginx's source IP/CIDR.
server {
    listen 443 ssl proxy_protocol;
    server_name gyai.dev;
    ssl_certificate /etc/letsencrypt/live/gyai.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gyai.dev/privkey.pem;

    set_real_ip_from 192.0.2.10/32;
    real_ip_header proxy_protocol;
    client_max_body_size 128m;

    location / {
        proxy_pass http://openai-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # $remote_addr is replaced with the PROXY protocol client address only
        # for trusted LB peers. Overwrite headers supplied by external clients.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }
}
