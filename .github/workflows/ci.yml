name: CI & Container Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests & container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: integration-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:5432/postgres?sslmode=disable
      POSTGRES_PASSWORD: ci-database-password
      MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test and build console
        run: npm ci && npm test && npm run build
        working-directory: web
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: PostgreSQL integration and race tests
        run: go test -race -count=1 ./...
      - name: Go static analysis
        run: go vet ./...
      - name: Validate deployment configurations
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose.yaml -f compose.build.yaml config --quiet
      - name: Build test image
        run: docker build -t openai-gateway:test .
      - name: Smoke test embedded console and database health
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          docker run -d --name openai-smoke --network host \
            -e DATABASE_URL -e MASTER_KEY -e ADMIN_PASSWORD \
            -e COOKIE_SECURE=false -e LISTEN_ADDR=127.0.0.1:8080 \
            openai-gateway:test
          trap 'docker logs openai-smoke; docker rm -f openai-smoke' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/healthz; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'id="root"'

  image:
    name: Publish multi-platform image
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write image summary
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '## Published container image'
            echo 'Platforms: linux/amd64, linux/arm64'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo "Digest: $IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare version notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          tag = os.environ['RELEASE_TAG']
          version = json.loads(Path('web/package.json').read_text())['version']
          lock = json.loads(Path('web/package-lock.json').read_text())
          if tag != 'v' + version or lock['version'] != version or lock['packages']['']['version'] != version:
              raise SystemExit('Release tag and application versions must match')
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('A stable semantic version tag is required')
          changelog = Path('CHANGELOG.md').read_text()
          heading = re.search(r'^## ' + re.escape(tag) + r' - [^\n]+\n', changelog, re.M)
          if heading is None:
              raise SystemExit('Missing changelog section for this release')
          notes = re.split(r'^## ', changelog[heading.end():], maxsplit=1, flags=re.M)[0].strip()
          if not notes:
              raise SystemExit('Release notes must not be empty')
          image, digest = os.environ['IMAGE_NAME'], os.environ['IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('Missing published image digest')
          notes += f'\n\n### Container images\n\n支持 `linux/amd64`、`linux/arm64`。\n\n```text\n{image}:{version}\n{image}:{tag}\n{image}@{digest}\n```\n'
          Path('release-notes.md').write_text(notes)
          PY
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --latest
          fi
